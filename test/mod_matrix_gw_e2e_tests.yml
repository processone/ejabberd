# The ejabberd mod_matrix_gw_e2e_tests starts: the Matrix gateway on
# example.com (matrix_domain and host at their defaults: @kim:example.com,
# matrix.example.com) with a test key of 32 zero bytes. No listener: the
# suite routes the stanzas itself and stands the federation in with
# functions. @DIR@ is the test's own directory.
hosts:
  - example.com
loglevel: warning
default_db: mnesia
listen: []
modules:
  mod_matrix_gw:
    key_name: test
    key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
